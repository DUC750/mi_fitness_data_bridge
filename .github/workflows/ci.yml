name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: python -m ruff check src tests scripts
      - run: python -m pytest -q -p no:cacheprovider

  minimum-mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      # Known-good combination for the mcp floor: mcp 1.12.0 with pydantic 2.11.10.
      # Unpinned, pip resolves pydantic 2.14.1, and mcp 1.12.0 then fails to import
      # (ImportError: eval_type_backport).
      - run: pip install -e ".[dev]" "mcp==1.12.0" "pydantic==2.11.10"
      - run: python -m pytest -q -p no:cacheprovider
